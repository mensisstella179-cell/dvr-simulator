name: Build DVRSimulator.exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang dependensi
        working-directory: desktop
        run: pip install -r requirements.txt
      - name: Salin aplikasi web ke folder desktop
        run: xcopy /E /I /Y docs desktop\app
        shell: cmd
      - name: Build exe
        working-directory: desktop
        run: pyinstaller --noconsole --onefile --name DVRSimulator --icon app.ico --add-data "app;app" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DVRSimulator-windows
          path: desktop/dist/DVRSimulator.exe
      - name: Lampirkan ke Release (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/DVRSimulator.exe
