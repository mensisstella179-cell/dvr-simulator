name: Build DVRSimulator (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang dependensi
        working-directory: desktop
        run: pip install -r requirements.txt

      - name: Salin aplikasi web ke folder desktop
        shell: cmd
        run: xcopy /E /I /Y docs desktop\app

      - name: Build aplikasi (mode folder)
        working-directory: desktop
        run: pyinstaller --noconsole --onedir --name DVRSimulator --icon app.ico --add-data "app;app" main.py

      - name: Kompres hasil build
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/DVRSimulator -DestinationPath desktop/dist/DVRSimulator-windows.zip

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: DVRSimulator-windows
          path: desktop/dist/DVRSimulator-windows.zip

      - name: Lampirkan ke Release (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/DVRSimulator-windows.zip
